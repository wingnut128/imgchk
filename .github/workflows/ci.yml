name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/paths-filter@5c5241b8233e77b55b9046daf88f1cb7560281de # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/ci.yml"

  # The conditional jobs below use step-level `if:` rather than job-level
  # so they always report SUCCESS to branch protection, even on PRs that
  # don't touch code. Job-level `if:` produces SKIPPED, which branch
  # protection treats as not-passing.

  lint:
    name: Format & Lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Skip — no code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected; skipping lint."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Skip — no code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected; skipping tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        if: needs.changes.outputs.code == 'true'
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - if: needs.changes.outputs.code == 'true'
        run: cargo nextest run --no-tests=pass

  audit:
    name: Security Audit
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Skip — no code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected; skipping audit."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        if: needs.changes.outputs.code == 'true'
        with:
          tool: cargo-audit
      - if: needs.changes.outputs.code == 'true'
        run: cargo audit

  build:
    name: Build (${{ matrix.target }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Skip — no code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected; skipping build for ${{ matrix.target }}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.changes.outputs.code == 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.target }}-
      - if: needs.changes.outputs.code == 'true'
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          name: imgchk-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/imgchk
