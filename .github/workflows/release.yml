name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Keyless signing of build provenance via GitHub OIDC — no key material
      # to manage. Scoped to this job; the top-level default stays read-only.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Validate tag format
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$RELEASE_TAG' is not vX.Y.Z"
            exit 1
          fi

      - name: Validate Cargo.toml version matches tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          cp "target/${TARGET}/release/imgchk" "dist/imgchk-${VERSION}-${TARGET}"

      # Attest each platform binary here, in the job that actually produced it,
      # so the provenance statement binds to this runner's build. dist/ holds
      # exactly one binary per matrix leg.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/imgchk-*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imgchk-${{ matrix.target }}
          path: dist/imgchk-*
          if-no-files-found: error

  publish:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Checked out before download-artifact so the clone cannot clobber dist/.
      # The SBOM scans this source tree. RELEASE_TAG is either a tag ref or a
      # workflow_dispatch input, and the build job (which this job `needs`)
      # has already rejected anything that is not vX.Y.Z.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Generated once per release, not per matrix leg or per PR — a plain
      # binary crate, so the subject is the source tree rather than an image.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/imgchk-${{ env.VERSION }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # Attested against the primary linux-x86_64 binary as the canonical
      # subject; the SBOM itself ships as a release asset for every platform.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/imgchk-${{ env.VERSION }}-x86_64-unknown-linux-gnu
          sbom-path: dist/imgchk-${{ env.VERSION }}.cyclonedx.json

      - name: Upload binaries and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # release-plz created the release as a draft. Upload binaries and the
          # CycloneDX SBOM (both match dist/imgchk-*), then flip it to non-draft.
          gh release upload "$RELEASE_TAG" dist/imgchk-* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
