name: Auto-Merge

# Auto-merge only ENABLES GitHub's native auto-merge (gh pr merge --auto) —
# the actual merge still waits on every required status check in branch
# protection (Detect Changes, Format & Lint, Test, Security Audit, Build x3,
# dependency-review). This workflow only decides *who* is trusted to skip
# manually clicking merge, not which checks must pass.
#
# Two independent trust paths, each separately gated:
#   - automerge-dependabot: dependabot[bot] PRs, gated on update type
#     (never auto-merges major version bumps) via dependabot/fetch-metadata.
#   - automerge-trusted: PRs opened by maintainers in TRUSTED_ACTORS below.
#     Triggered on `pull_request` (not `pull_request_target`), so GitHub
#     forces GITHUB_TOKEN to read-only for any fork-originated PR regardless
#     of the `permissions:` block here — a malicious fork PR cannot grant
#     itself merge rights by editing this file. The same-repo check below is
#     belt-and-suspenders on top of that platform guarantee.
#
# To trust an additional maintainer, add their GitHub login to
# TRUSTED_ACTORS in the automerge-trusted job below.
#
# The merge step in both jobs authenticates with RELEASE_PLZ_TOKEN (a
# fine-grained PAT, not GITHUB_TOKEN). GitHub does not fire other workflows'
# `push`/`pull_request` triggers for events produced using the default
# GITHUB_TOKEN (loop-prevention) — so a merge performed with GITHUB_TOKEN
# silently skips CI, CodeQL, and release-plz on main, and no release PR ever
# gets opened for the merged change. Using a PAT here matches how
# release-plz.yml already authenticates for the same reason (see its
# comment / project CLAUDE.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  automerge-dependabot:
    name: Auto-Merge (Dependabot)
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # GITHUB_TOKEN no longer performs the merge (see RELEASE_PLZ_TOKEN note
    # above) — read is all it needs for fetch-metadata.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  automerge-trusted:
    name: Auto-Merge (Trusted Maintainer)
    runs-on: ubuntu-latest
    # Same-repo check is redundant with GitHub's fork-PR token downgrade,
    # kept explicit so this condition is self-documenting and doesn't rely
    # on readers knowing the platform-level guarantee.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["wingnut128"]'), github.actor)
    # GITHUB_TOKEN no longer performs the merge (see RELEASE_PLZ_TOKEN note
    # above) — this job needs no write access to the default token at all.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
