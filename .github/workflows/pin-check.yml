# ===================================================================
# Pin Check — fails PRs that introduce tag-pinned GitHub Actions, or
# that pin two entry points of the SAME action to different SHAs.
#
# Defense-in-depth against action-tag force-push attacks
# (e.g., aquasecurity/trivy-action, March 2026).
#
# Note: runs on every PR (not just workflow-touching ones) so it can
# serve as a required status check without hanging unrelated PRs.
# ===================================================================
name: Pin Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  pinact:
    name: Verify all actions pinned by SHA
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify all actions pinned by SHA
        shell: bash
        run: |
          set -euo pipefail
          # Find every `uses: owner/repo@ref` (excluding local `./` and docker:// refs)
          # and fail if ref isn't a 40-char lowercase hex SHA. Inline commit comments
          # like `# v1.2.3` are preserved by GitHub's parser and ignored here.
          violations=$(grep -rHnE '^\s*-?\s*uses:\s*[^./@[:space:]][^@[:space:]]*@[^[:space:]#]+' .github/ \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|#|$)' || true)
          if [ -n "$violations" ]; then
            echo "::error::Actions must be pinned by 40-char commit SHA, not tag/branch:"
            echo "$violations"
            exit 1
          fi
          echo "All actions SHA-pinned."

      - name: Verify each action is pinned to a single SHA
        shell: bash
        run: |
          set -euo pipefail
          # Multi-entry-point actions must move in lockstep. github/codeql-action
          # ships init/ and analyze/ as separate Dependabot dependencies, and
          # analyze aborts when it reads a config written by a different version
          # ("Loaded a configuration file for version X, but running version Y").
          # A split bump therefore reds out CodeQL on main and on every open PR
          # until the second half merges. .github/dependabot.yml groups those
          # bumps so they land together; this check enforces the same invariant
          # on the merged tree, for hand-edits and for any future action that
          # exposes more than one entry point.
          #
          # Key on the action REPOSITORY (owner/repo), ignoring any sub-path,
          # and fail if one repository appears with more than one SHA.
          mismatches=$(grep -rhoE '^\s*-?\s*uses:\s*[^./@[:space:]][^@[:space:]]*@[0-9a-f]{40}' .github/ \
            | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//' \
            | awk -F@ '{ split($1, p, "/"); print p[1] "/" p[2] " " $2 }' \
            | sort -u \
            | awk '{ count[$1]++; shas[$1] = shas[$1] " " $2 }
                   END { for (a in count) if (count[a] > 1) print a ":" shas[a] }')
          if [ -n "$mismatches" ]; then
            echo "::error::Each action must be pinned to ONE SHA across all workflows:"
            echo "$mismatches"
            exit 1
          fi
          echo "Every action pinned to a single SHA."
