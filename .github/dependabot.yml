version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # github/codeql-action/init and .../analyze MUST move in lockstep.
      # analyze refuses to run against a config written by a different
      # version of init ("Loaded a configuration file for version '4.37.7',
      # but running version '4.37.6'"), so splitting the bump across two PRs
      # breaks CodeQL on main AND on every open PR for the whole window
      # between the two merges (see ENG failed-runs triage, 2026-08-19).
      # Grouped across ALL update types, majors included, for that reason.
      # .github/workflows/pin-check.yml enforces the same invariant on the
      # merged tree, so a hand-edit can't reintroduce the skew either.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else lands as ONE PR per week rather than one PR per
      # action. Beyond the review churn, a burst of individually
      # auto-merged bumps means a burst of pushes to main, and each push
      # fires its own Release-plz run — which is how four runs ended up
      # racing on the same release PR. Majors stay ungrouped so they get an
      # individual PR and are never auto-merged (see automerge.yml).
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # oci-spec must move in lockstep with oci-client, never on its own.
      # oci-client types `manifest::Platform` fields as oci_spec::image::Arch /
      # Os from its OWN oci-spec, and re-exports only distribution::{ParseError,
      # Reference} — so the test in src/image/registry.rs can reach Arch/Os only
      # via a direct dev-dependency, which must therefore match oci-client's
      # internal pin exactly. Bumping it alone puts two incompatible oci-spec
      # versions in the graph and fails to compile (see #123).
      #
      # For 0.x crates Dependabot labels 0.9 -> 0.10 as semver-MINOR even though
      # Cargo treats it as breaking, so minor is ignored here alongside major.
      # Patch bumps (0.9.0 -> 0.9.1) stay allowed: those are compatible.
      # Remove this entry once oci-client itself moves to oci-spec 0.10+.
      - dependency-name: oci-spec
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
