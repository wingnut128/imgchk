[package]
name = "imgchk"
version = "0.4.16"
edition = "2024"
description = "Container image inspector and layer extraction tool"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
oci-client = "0.17"
ocirender = "0.2"
indicatif = "0.18"
filetime = "0.2"

[dev-dependencies]
# Pinned to whatever oci-client depends on internally, NOT to the latest
# release. Tests build `oci_client::manifest::Platform`, whose fields are typed
# as oci_spec::image::{Arch, Os}; oci-client re-exports only
# oci_spec::distribution::{ParseError, Reference}, so those types are reachable
# only through this direct dependency. A mismatch puts two incompatible
# oci-spec versions in the graph and fails to compile. Bump only together with
# oci-client. Dependabot is configured to skip it (see .github/dependabot.yml).
oci-spec = "0.9"
