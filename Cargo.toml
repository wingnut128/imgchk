[package]
name = "imgchk"
version = "0.1.0"
edition = "2021"
description = "Container image inspector and layer extraction tool"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
oci-distribution = "0.11"
indicatif = "0.17"
