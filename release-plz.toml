[workspace]
# Binary-first project, not a public crates.io release.
#
# Auto-bump workflow: use git tags (not the registry) to determine the
# released version, so release-plz CAN compute the next version for an
# unpublished crate from conventional commits. The release-pr job then
# opens a `chore: release vX.Y.Z` Release PR that bumps Cargo.toml +
# Cargo.lock + CHANGELOG.md; merging it creates the tag + draft GitHub
# Release, and release.yml attaches binaries + un-drafts.
git_only = true
publish = false
# Keep the GitHub Release + tag creation — release.yml builds and
# uploads binaries on tag push.
git_release_enable = true
git_tag_enable = true
# Keep the changelog in the repo, generated from conventional commits.
# Don't maintain a `## [Unreleased]` block by hand — release-plz inserts its
# own version sections; doing both fights itself.
changelog_update = true
# The binary-upload workflow triggers on tag push; create release as
# draft so it isn't public until the binaries are attached.
git_release_draft = true

[[package]]
name = "imgchk"
# Bump from conventional commits alone. cargo-semver-checks (release-plz
# default) only bumps on actual public-API changes, so releases driven by
# build/CI/docs commits — which don't touch the public API of a binary
# crate — would never get cut. Disabling the check lets feat:/fix:/build:
# commits drive the bump directly.
semver_check = false

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
